name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      force:
        description: Force build+push even if the tag already exists on ghcr.io
        type: boolean

env:
  IMAGE_NAME: pi-agent

jobs:

  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: |
        if [ "${{ inputs.force }}" == "true" ]; then
          CT_TOOL=docker ./build.sh --build-ghcr --force
        else
          CT_TOOL=docker ./build.sh --build-ghcr
        fi
    # build.sh removes pi_agent_tag.txt when it skips, so the push steps
    # silently skip in that case
    - name: Log in to registry
      if: ${{ hashFiles('pi_agent_tag.txt') != '' }}
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    - name: Push image
      if: ${{ hashFiles('pi_agent_tag.txt') != '' }}
      run: |
        TAG=$(cat pi_agent_tag.txt)
        IMAGE_ID=ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME
        IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
        echo IMAGE_ID=$IMAGE_ID
        echo TAG=$TAG
        docker tag $IMAGE_NAME $IMAGE_ID:$TAG
        docker push $IMAGE_ID:$TAG
        docker tag $IMAGE_NAME $IMAGE_ID:latest
        docker push $IMAGE_ID:latest
